<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>わかちゃんのおへや🐼</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='12' cy='12.5' r='7' fill='%232F3438'/%3E%3Ccircle cx='36' cy='12.5' r='7' fill='%232F3438'/%3E%3Cellipse cx='24' cy='27' rx='17.5' ry='15.5' fill='%23fff' stroke='%232F3438' stroke-width='1.6'/%3E%3Cellipse cx='17' cy='25' rx='5.2' ry='6.2' fill='%232F3438'/%3E%3Cellipse cx='31' cy='25' rx='5.2' ry='6.2' fill='%232F3438'/%3E%3Cellipse cx='24' cy='32' rx='3' ry='2.2' fill='%232F3438'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>html,body{margin:0;padding:0;background:#FFFBF3;-webkit-text-size-adjust:100%}</style>
</head>
<body>
<style>
  :root{
    --paper:#FAFBF3; --surface:#FFFFFF; --ink:#2C332C; --sumi:#495049;
    --bamboo:#4E8B5F; --bamboo-d:#356547; --bamboo-l:#E7F1E4;
    --sasa:#8FBF7E; --sasa-p:#C9DEC2;
    --blush:#E8A2AC; --blush-d:#C86E7C; --blush-l:#FDF1F2;
    --muted:#87908A; --line:#E4E7D8; --rule:#DBE4D8;
    --mincho:"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho",serif;
    --gothic:"Yu Gothic","YuGothic","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
    --mono:"SFMono-Regular",Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  .ka{font-family:var(--gothic);color:var(--ink);line-height:1.6;
      background-color:var(--paper);
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><g fill='none' stroke='%23C9DEC2' stroke-width='1.3' opacity='.75'><path d='M14 62 C34 30 74 20 100 26 C82 62 44 78 14 62Z'/><path d='M14 62 C44 56 78 44 100 26'/></g><g fill='none' stroke='%23DCE9D6' stroke-width='1.3' opacity='.85'><path d='M186 148 C166 116 126 106 100 112 C118 148 156 164 186 148Z'/><path d='M186 148 C156 142 122 130 100 112'/></g><g fill='none' stroke='%23DCE9D6' stroke-width='1.3' opacity='.6'><path d='M96 178 C104 156 128 142 148 142 C142 168 118 182 96 178Z'/><path d='M96 178 C118 172 138 158 148 142'/></g></svg>");
      background-size:220px 220px;background-attachment:local}
  .ka button{font-family:inherit;cursor:pointer}
  .ka input,.ka select,.ka textarea{font-family:inherit;color:var(--ink)}

  /* ---------- ヘッダ（竹の節） ---------- */
  .hd{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding:16px 22px 16px;flex-wrap:wrap;
      background:linear-gradient(180deg,#FFFFFF 0%, #F3F7EC 100%);
      border-bottom:3px solid var(--bamboo);border-radius:0 0 24px 24px;
      box-shadow:0 3px 0 -1px var(--sasa-p)}
  .hd::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;
      background:repeating-linear-gradient(90deg,var(--bamboo-d) 0 14px,transparent 14px 30px);opacity:.5}
  .brand{display:flex;align-items:center;gap:10px}
  .brand h1{font-family:var(--mincho);font-size:24px;font-weight:600;margin:0;letter-spacing:.06em}
  .brand small{display:block;font-family:var(--gothic);font-size:11px;color:var(--muted);letter-spacing:.14em;margin-top:2px}
  .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--sumi);
       padding:7px 14px;border-radius:999px;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--bamboo);color:var(--bamboo-d);background:var(--bamboo-l)}
  .btn:focus-visible{outline:2px solid var(--bamboo);outline-offset:2px}
  .btn.pri{background:var(--bamboo);border-color:var(--bamboo);color:#fff}
  .btn.pri:hover{background:var(--bamboo-d);color:#fff}
  .btn.dgr{color:var(--blush-d);border-color:#F0D3D8}
  .btn.dgr:hover{background:var(--blush);color:#fff;border-color:var(--blush)}
  .btn.sm{padding:4px 11px;font-size:12px}
  .btn[disabled]{opacity:.5;cursor:default}

  .tabs{display:flex;padding:12px 22px 0;gap:8px}
  .tab{border:1px solid var(--line);background:#FFFFFFAA;padding:8px 18px;border-radius:14px 14px 0 0;
       font-size:13.5px;color:var(--muted);letter-spacing:.06em;border-bottom:none}
  .tab.on{color:var(--bamboo-d);background:var(--surface);font-weight:600;box-shadow:0 -3px 0 var(--sasa) inset}
  .tab svg{vertical-align:-3px;margin-right:5px}
  .wrap{padding:0 22px 70px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:0 16px 16px 16px;padding:16px;
         box-shadow:0 2px 12px rgba(78,139,95,.06)}

  /* ---------- ステータス ---------- */
  .status{border:1px solid var(--line);background:#FFFFFF;border-radius:14px;margin:14px 0;overflow:hidden}
  .status .top{display:flex;align-items:center;gap:10px;padding:9px 13px;flex-wrap:wrap;font-size:12px}
  .status .dot{width:9px;height:9px;border-radius:50%;background:var(--bamboo);flex:none}
  .status.warn{background:#FFFBEF;border-color:#EEE0BB}
  .status.warn .dot{background:#D9A93F}
  .status.bad{background:var(--blush-l);border-color:#F0D3D8}
  .status.bad .dot{background:var(--blush-d)}
  .status .grow{flex:1;min-width:180px}
  .status .num{font-family:var(--mono);color:var(--ink);font-weight:600}
  .detail{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:pre-wrap;
          border-top:1px dashed var(--line);padding:9px 13px;line-height:1.7}

  /* ---------- 絞り込み ---------- */
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .fin{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--surface)}
  .fin:focus{outline:none;border-color:var(--bamboo)}
  .fin.search{min-width:210px;flex:1;border-radius:999px}
  .count{font-size:12.5px;color:var(--muted)}
  .count b{font-family:var(--mono);font-size:15px;color:var(--bamboo-d)}

  /* ---------- カード ---------- */
  .cards{display:grid;gap:11px}
  .card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sasa-p);border-radius:16px;
        padding:13px 16px 13px 13px;cursor:pointer;transition:.15s;text-align:left;width:100%;
        display:flex;gap:12px;align-items:flex-start;font:inherit}
  .card:hover{border-color:var(--bamboo);border-left-color:var(--sasa);box-shadow:0 4px 16px rgba(78,139,95,.14);transform:translateY(-1px)}
  .card:focus-visible{outline:2px solid var(--bamboo);outline-offset:2px}
  .card .av{flex:none;width:46px;height:46px;border-radius:62% 8% 62% 8%;
            background:linear-gradient(140deg,#EDF5E9,#D8E9D2);transform:rotate(-8deg);
            display:flex;align-items:center;justify-content:center}
  .card .av svg{transform:rotate(8deg)}
  .card:hover .av{background:linear-gradient(140deg,#E3F0DD,#CBE2C4)}
  .card .bd{flex:1;min-width:0}
  .c1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
  .yr{font-family:var(--mono);font-size:11.5px;color:#fff;background:var(--ink);padding:2px 9px;border-radius:999px}
  .kind{font-size:11.5px;color:var(--bamboo-d);background:var(--bamboo-l);border:1px solid #D6E6DA;padding:2px 9px;border-radius:999px}
  .sub2{font-family:var(--mincho);font-size:16px;font-weight:600;letter-spacing:.04em}
  .cmt{font-size:11.5px;color:var(--blush-d);border:1px solid #F0D3D8;background:var(--blush-l);padding:1px 9px;border-radius:999px}
  .tagf{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:999px}
  .c2{font-size:11.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
  .c2 b{font-family:var(--mono);color:var(--sumi);font-weight:600}
  .prev{margin-top:8px;font-family:var(--mincho);font-size:12.5px;color:#5A6165;line-height:20px;max-height:40px;overflow:hidden}

  .empty{border:2px dashed var(--line);background:var(--surface);border-radius:18px;padding:34px 22px;text-align:center}
  .empty p{margin:10px 0 14px;color:var(--muted);font-size:13.5px}

  /* ---------- ドロワー ---------- */
  .scrim{position:fixed;inset:0;background:rgba(47,52,56,.32);z-index:40}
  .drw{position:fixed;top:0;right:0;bottom:0;width:min(1500px,98vw);background:var(--paper);z-index:41;
       overflow-y:auto;box-shadow:-2px 0 26px rgba(47,52,56,.18)}
  .dh{position:sticky;top:0;background:#FFFDF8;border-bottom:1px solid var(--line);padding:12px 20px;
      display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:3}
  .dh h2{font-family:var(--mincho);font-size:18px;margin:0;font-weight:600;display:flex;align-items:center;gap:8px}
  .db{padding:18px 20px 80px}
  .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px;
        border-bottom:1px dashed var(--line);padding-bottom:12px}
  .meta b{font-family:var(--mono);color:var(--sumi);font-weight:600}

  /* ---------- 答案用紙 ---------- */
  .sheetwrap{overflow-x:auto}
  .sheet{list-style:none;margin:0;padding:0;width:max-content;min-width:100%}
  .sheet li{display:flex;align-items:stretch;border-bottom:1px solid var(--rule);min-height:32px;cursor:pointer}
  .sheet li:hover{background:#F7FAF7}
  .sheet .ln{flex:none;width:34px;text-align:right;padding-right:12px;font-family:var(--mono);
             font-size:10.5px;color:#A9B2AA;line-height:32px;user-select:none}
  .sheet .tx{font-family:var(--mincho);font-size:15px;line-height:32px;white-space:pre;
             letter-spacing:0;width:30em;flex:none}
  .sheet .tx .hit{background:#FBEFB4}
  .sheet .tx .cm{background:#FDF0F2;border-bottom:1.5px solid var(--blush);cursor:pointer}
  .sheet .tx .cm.on{background:#FBDCE1}
  .sheet .tx .sel{background:var(--bamboo-l);border-bottom:1.5px solid var(--bamboo)}
  .pgmark{display:flex;align-items:center;gap:10px;margin:3px 0 3px 46px;font-size:10.5px;color:var(--bamboo-d);letter-spacing:.1em}
  .pgmark::before{content:"";display:inline-block;width:11px;height:8px;background:var(--sasa);border-radius:70% 8% 70% 8%;transform:rotate(-14deg);flex:none}
  .pgmark::after{content:"";flex:1;border-top:1px dashed var(--sasa-p)}

  /* ---------- メモ ---------- */
  .chd{font-family:var(--mincho);font-size:16px;font-weight:600;border-bottom:1px solid var(--bamboo);padding-bottom:6px;margin:0 0 12px}
  .chd::before{content:"";display:inline-block;width:13px;height:9px;margin-right:7px;background:var(--sasa);border-radius:70% 8% 70% 8%;transform:rotate(-14deg)}
  .cItem{border:1px solid var(--line);background:var(--surface);border-left:3px solid var(--blush);
         border-radius:0 12px 12px 0;padding:11px 13px;margin-bottom:9px}
  .cTop{display:flex;justify-content:flex-end;align-items:baseline;gap:10px;margin-bottom:5px}
  .cWhen{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .cBody{font-size:13.5px;white-space:pre-wrap;word-break:break-word;line-height:1.85}

  /* ---------- フォーム ---------- */
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:11px;letter-spacing:.1em;color:var(--muted);margin-bottom:5px;font-weight:600}
  .req{color:var(--blush-d);font-size:10px;border:1px solid #F0D3D8;background:var(--blush-l);
       padding:1px 6px;margin-left:6px;border-radius:999px;letter-spacing:.05em}
  .opt{color:var(--bamboo-d);font-size:10px;border:1px solid #D6E6DA;background:var(--bamboo-l);
       padding:1px 6px;margin-left:6px;border-radius:999px;letter-spacing:.05em}
  .fin2{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;background:var(--surface)}
  .fin2:focus{outline:none;border-color:var(--bamboo)}
  .fin2.bad{border-color:var(--blush-d);background:var(--blush-l)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .drop{border:2px dashed var(--line);background:var(--surface);border-radius:16px;padding:20px 18px;text-align:center}
  .drop.on{border-color:var(--bamboo);background:var(--bamboo-l)}
  .drop p{margin:8px 0 10px;font-size:13px;color:var(--muted)}
  .ta{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px;background:var(--surface);
      resize:vertical;line-height:1.8;font-family:var(--mincho);min-height:140px}
  .ta.short{min-height:78px;font-family:var(--gothic)}
  .ta:focus{outline:none;border-color:var(--bamboo)}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.7}
  .hint b{font-family:var(--mono);color:var(--sumi)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .err{background:var(--blush-l);border:1px solid #F0D3D8;border-left:3px solid var(--blush-d);border-radius:0 12px 12px 0;
       padding:11px 13px;font-size:12.5px;color:#8A4049;margin:12px 0;line-height:1.8}
  .ok{background:var(--bamboo-l);border:1px solid #D6E6DA;border-radius:12px;
      padding:11px 13px;font-size:12.5px;color:#33604A;margin:12px 0;line-height:1.8}
  .loadbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:70;
           display:flex;align-items:center;gap:9px;background:#FFFFFF;border:1px solid var(--sasa);
           border-radius:999px;padding:8px 18px;font-size:12.5px;color:var(--bamboo-d);
           box-shadow:0 4px 18px rgba(78,139,95,.22)}
  .loadbar .lf{width:15px;height:10px;background:var(--sasa);border-radius:70% 8% 70% 8%;
               animation:sway .8s ease-in-out infinite alternate;flex:none}
  .loadbar .lf.b{animation-delay:.18s;opacity:.6}
  @keyframes sway{from{transform:rotate(-28deg)}to{transform:rotate(22deg)}}
  .selpop{position:absolute;z-index:8;width:min(320px,86vw);background:#FFFFFF;
          border:1px solid var(--sasa);border-radius:14px;padding:11px 12px;
          box-shadow:0 8px 26px rgba(44,51,44,.20)}
  .selpop .ph{font-size:11px;color:var(--bamboo-d);margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .selpop .pq{font-family:var(--mincho);font-size:11.5px;color:var(--muted);
              border-left:2px solid var(--sasa-p);padding-left:7px;margin-bottom:7px;
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .selpop textarea{min-height:70px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
         padding:10px 20px;font-size:13px;z-index:60;border-radius:999px;display:flex;align-items:center;gap:8px}

  /* ---------- 問題の添付 ---------- */
  .att{border:1px solid var(--line);background:var(--surface);border-radius:14px;margin-bottom:16px;overflow:hidden}
  .attHd{display:flex;align-items:center;gap:9px;padding:10px 14px;background:#FBF7EF;cursor:pointer;font-size:13px}
  .attHd .nm{flex:1;font-family:var(--mono);font-size:11.5px;color:var(--muted);
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attBody{padding:12px 14px;border-top:1px dashed var(--line);background:#FDFDFB}
  .attBody canvas,.attBody img{max-width:100%;display:block;margin:0 auto 10px;border:1px solid var(--line);border-radius:6px}
  .attBody pre{font-family:var(--mincho);font-size:13px;white-space:pre-wrap;line-height:1.9;margin:0}

  /* ---------- カレンダー ---------- */
  .calhd{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .calhd h3{font-family:var(--mincho);font-size:19px;margin:0;font-weight:600;letter-spacing:.06em;min-width:150px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);
       background:var(--surface);border-radius:14px;overflow:hidden}
  .cal .dow{padding:7px 4px;text-align:center;font-size:11.5px;color:var(--muted);
            border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#F6F3EC}
  .cal .dow.sun{color:var(--blush-d)}
  .cal .dow.sat{color:#5E7E9A}
  .cal .day{min-height:98px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
            padding:5px 6px;cursor:pointer;transition:.12s}
  .cal .day:hover{background:#F7FAF7}
  .cal .day.out{background:#FBFAF6;color:#C6CBC7;cursor:default}
  .cal .day.today{box-shadow:inset 0 0 0 2px var(--bamboo)}
  .cal .dnum{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .cal .day.sun .dnum{color:var(--blush-d)}
  .cal .day.sat .dnum{color:#5E7E9A}
  .ev{margin-top:3px;font-size:10.5px;background:#EEF3F6;border-left:2px solid #7C9FBA;padding:2px 5px;
      border-radius:0 6px 6px 0;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev b{font-family:var(--mono);font-weight:600}
  .ev.auto{background:var(--bamboo-l);border-left-color:var(--bamboo)}

  /* ---------- 本文＋メモの2段組 ---------- */
  .vpane{position:relative;display:flex;align-items:flex-start}
  .pages{flex:none;display:grid;grid-template-columns:repeat(2,max-content);gap:14px}
  .pagecol{flex:none;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sasa-p);
           border-radius:14px;padding:14px 12px}
  .sheetcol{flex:none;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sasa-p);border-radius:14px;
            padding:14px 14px;position:relative}
  .pghd{font-size:10.5px;color:var(--bamboo-d);letter-spacing:.1em;margin:0 0 6px 42px}
  .gapcol{flex:none;width:46px}
  .memocol{position:relative;flex:0 0 300px;min-width:300px}
  .pb{border:none;background:none;padding:2px;cursor:pointer;font-size:26px;line-height:1;transition:.12s}
  .pb:hover{transform:scale(1.12)}
  .pb.off{opacity:.25;filter:grayscale(1)}
  .rate{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
  .rlbl{font-size:12.5px;color:var(--muted);margin-left:8px}
  .memoCard{position:absolute;left:0;right:0;background:#FFFFFF;border:1px solid var(--line);
            border-left:3px solid var(--blush);border-radius:0 12px 12px 0;padding:10px 12px;transition:.12s}
  .memoCard.on{border-color:var(--blush);box-shadow:0 2px 10px rgba(232,162,172,.3)}
  .memoAnchor{font-size:10.5px;font-family:var(--mono);color:var(--blush-d);margin-bottom:3px}
  .memoQuote{font-family:var(--mincho);font-size:11.5px;color:var(--muted);border-left:2px solid var(--rule);
             padding-left:7px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conn{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:1}
  .sheet li.anch{background:#FFF6D9}
  .selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);
          background:#FFFBEF;border:1px solid #EEE0BB;border-radius:12px;padding:8px 12px;margin-bottom:10px}
  @media(max-width:1100px){
    .vpane{flex-direction:column}
    .pages{grid-template-columns:1fr;gap:12px}
    .gapcol{display:none}
    .memocol{position:static;width:100%;margin-top:14px}
    .memoCard{position:static!important;margin-bottom:10px}
    .conn{display:none}
  }

  /* ---------- わかちゃんの成長記録 ---------- */
  @font-face{font-family:"WkNum";src:local("Century"),local("Century-Regular"),local("CenturyStd"),local("Century Schoolbook"),local("CenturySchoolbook"),local("New Century Schoolbook");
    unicode-range:U+0020-007E}
  .gw{--num:"WkNum","Century","Century Schoolbook","New Century Schoolbook",Georgia,"Times New Roman",serif;
      --shu:#B9473B;font-family:var(--mincho)}
  .gw .n{font-family:var(--num);font-variant-numeric:lining-nums tabular-nums}
  .gw-band{position:relative;overflow:hidden;background:#263028;color:#F2F5EC;border-radius:14px;padding:22px 24px 20px;
      display:grid;grid-template-columns:1fr auto;gap:18px 24px;align-items:end}
  .gw-band::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;
      background:repeating-linear-gradient(90deg,transparent 0 58px,#8FBF7E 58px 60px)}

<script>
(function(){
  const PFX='waka_';
  const KIND={d:'d_', c:'c_', e:'e_'};        // 答案 / メモ / 予定
  const FILEPFX=PFX+'f_';                     // 添付ファイル（必要なときだけ読む）
  const IXKEY=k=>PFX+'ix_'+k;
  const PROBE=PFX+'probe';
  const AUTHOR='わかちゃん';
  const SUBJECTS=['憲法','行政法','民法','商法','民事訴訟法','刑法','刑事訴訟法','倒産法','その他'];
  const EXAMS=['予備試験','司法試験','法科大学院入試'];
  const fixExam=v=>v==='ロー入試'?'法科大学院入試':(v||'');
  const YEARS=['R9','R8','R7','R6','R5','R4','R3','R2','R1','H31','H30','H29','H28','H27','H26','H25','H24','H23','旧司法'];
  const POLL=20000, PER_PAGE=23, MAXFILE=3.4*1024*1024;

  let mode='memory', shared=true, diag='', lastSync=null, busy=false, view='list';
  let drafts=[], comments=[], events=[], mem={d:[],c:[],e:[]}, memFiles={};
  let filt={year:'',exam:'',subject:'',q:''};
  let page=1; const PER_LIST=20;
  let calCur=new Date();

  if(window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const chars=t=>(t||'').replace(/\s/g,'').length;
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const emsg=e=>(e&&e.message)?e.message:String(e);
  const pad=n=>String(n).padStart(2,'0');
  const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const STARS=['','もう一度','あと少し','まずまず','よく書けた','完璧'];
  function rateHTML(v){
    let h='';
    for(let i=1;i<=5;i++) h+='<button type="button" class="pb'+(i<=v?'':' off')+'" data-r="'+i+'" title="'+STARS[i]+'">\u{1F43C}</button>';
    h+='<span class="rlbl">'+(v?v+' ／ 5　'+STARS[v]:'未評価')+'</span>';
    return h;
  }
  function wireRate(host,get,set){
    host.innerHTML=rateHTML(get());
    host.querySelectorAll('.pb').forEach(function(b){
      b.onclick=function(){ const n=Number(b.dataset.r); set(get()===n?0:n); wireRate(host,get,set); };
    });
  }
  function fmtWhen(iso){
    if(!iso) return '';
    const t=new Date(iso);
    if(isNaN(t.getTime())) return String(iso).slice(0,16).replace('T',' ');
    return t.getFullYear()+'/'+pad(t.getMonth()+1)+'/'+pad(t.getDate())+' '+pad(t.getHours())+':'+pad(t.getMinutes());
  }
  function fmtDay(iso){
    if(!iso) return '';
    const t=new Date(iso);
    if(isNaN(t.getTime())) return String(iso).slice(0,10);
    return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  }

  /* パンダ */
  function panda(s){
    return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 48 48" aria-hidden="true">'
      +'<circle cx="12" cy="12.5" r="7" fill="#2F3438"/><circle cx="36" cy="12.5" r="7" fill="#2F3438"/>'
      +'<circle cx="12" cy="12.5" r="3.2" fill="#8C7F86"/><circle cx="36" cy="12.5" r="3.2" fill="#8C7F86"/>'
      +'<ellipse cx="24" cy="27" rx="17.5" ry="15.5" fill="#FFFFFF" stroke="#2F3438" stroke-width="1.6"/>'
      +'<ellipse cx="17" cy="25" rx="5.2" ry="6.2" fill="#2F3438" transform="rotate(-14 17 25)"/>'
      +'<ellipse cx="31" cy="25" rx="5.2" ry="6.2" fill="#2F3438" transform="rotate(14 31 25)"/>'
      +'<circle cx="17.6" cy="25.2" r="1.9" fill="#FFFFFF"/><circle cx="30.4" cy="25.2" r="1.9" fill="#FFFFFF"/>'
      +'<ellipse cx="24" cy="32" rx="3" ry="2.2" fill="#2F3438"/>'
      +'<path d="M20.5 35.6 Q24 38.4 27.5 35.6" stroke="#2F3438" stroke-width="1.6" fill="none" stroke-linecap="round"/>'
      +'<circle cx="10.5" cy="31" r="2.6" fill="#E8A2AC" opacity=".6"/><circle cx="37.5" cy="31" r="2.6" fill="#E8A2AC" opacity=".6"/>'
      +'</svg>';
  }
  function emo(px){
    return '<span style="font-size:'+px+'px;line-height:1;display:inline-block;font-family:\'Apple Color Emoji\',\'Segoe UI Emoji\',\'Noto Color Emoji\',sans-serif">\u{1F43C}</span>';
  }
  function toast(m){
    const e=document.createElement('div');e.className='toast';
    e.innerHTML=panda(18)+'<span>'+esc(m)+'</span>';
    document.body.appendChild(e);setTimeout(()=>e.remove(),2600);
  }
  function showMsg(h){$('#msg').innerHTML=h||'';}
  let loadN=0;
  function setLoading(on,txt){
    const bar=$('#loadbar');
    if(on){ loadN++; if(txt) $('#loadTxt').textContent=txt; bar.style.display=''; }
    else { loadN=Math.max(0,loadN-1); if(loadN===0) bar.style.display='none'; }
  }
  /* 笹の葉 */
  function leaf(w,fill,rot,op){
    const h=Math.round(w*0.62);
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 100 62" aria-hidden="true" '
      +'style="transform:rotate('+(rot||0)+'deg);opacity:'+(op||1)+'">'
      +'<path d="M4 54 C22 16 62 2 96 6 C80 44 40 62 4 54Z" fill="'+(fill||'#8FBF7E')+'"/>'
      +'<path d="M4 54 C40 44 74 26 96 6" stroke="#FFFFFF" stroke-width="2.2" fill="none" opacity=".65"/>'
      +'</svg>';
  }
  $('#brand').insertAdjacentHTML('afterbegin',
    '<span style="display:flex;align-items:center;gap:2px">'
    +leaf(26,'#B7D6A8',-24,.95)+emo(40)+leaf(20,'#8FBF7E',148,.9)+'</span>');
  document.querySelectorAll('.tab').forEach(function(t){
    t.insertAdjacentHTML('afterbegin',leaf(15,'#9CCB8B',-18,.9));
  });

  /* ============ 保存先の診断 ============ */
  async function diagnose(){
    diag=''; const log=[];
    if(!window.storage){ mode='memory'; diag='window.storage がこの画面に用意されていません。'; return; }
    for(const sh of [true,false]){
      try{
        const w=await window.storage.set(PROBE,'ok',sh);
        if(!w) throw new Error('set が空を返しました');
        const r=await window.storage.get(PROBE,sh);
        if(!r||r.value!=='ok') throw new Error('書いた値を読み戻せません');
        let canList=false, lerr='';
        try{ const l=await window.storage.list(PFX,sh); canList=!!(l&&Array.isArray(l.keys)); if(!canList) lerr='keys が返りません'; }
        catch(e){ lerr=emsg(e); }
        try{ await window.storage.delete(PROBE,sh); }catch(e){}
        shared=sh; mode = sh ? (canList?'list':'index') : 'local';
        diag='共有保存='+(sh?'可':'不可')+' ／ 一覧取得='+(canList?'可':'不可'+(lerr?'（'+lerr+'）':''))
             +(canList?'':'\n→ 目次キーで管理します。')+(log.length?'\n'+log.join('\n'):'');
        return;
      }catch(e){ log.push('shared='+sh+' → '+emsg(e)); }
    }
    mode='memory'; diag=log.join('\n');
  }

  function paintStatus(){
    const el=$('#status');
    el.className='status'+(mode==='memory'?' bad':(mode==='local'?' warn':''));
    let head;
    if(mode==='list'||mode==='index') head=window.__sync?'クラウドに保存されています。MacでもiPhoneでも，ログインすれば同じ答案が出ます。':window.__idb?'このブラウザの中に保存されています。同じ端末・同じブラウザで開けば、いつでも同じ答案が出てきます。':'ちゃんと保存されています。この画面を開けば、いつでも同じ答案が出てきます。';
    else if(mode==='local') head='共有の保存先に届きませんでした。いまはこの端末のこの画面だけに残ります。';
    else head='保存できません。閉じると消えます。必ず「書き出し」で控えを取ってください。';
    const t=lastSync?('最終更新 '+pad(lastSync.getHours())+':'+pad(lastSync.getMinutes())+':'+pad(lastSync.getSeconds())):'未取得';
    el.innerHTML='<div class="top"><span class="dot"></span><span class="grow">'+esc(head)+'</span>'
      +'<span>答案 <span class="num">'+drafts.length+'</span>　メモ <span class="num">'+comments.length+'</span>　予定 <span class="num">'+events.length+'</span></span>'
      +'<span>'+esc(t)+'</span>'
      +'<button class="btn sm" id="bDiag">詳細</button><button class="btn sm" id="bRe">保存先を再確認</button>'+(window.__sync?'<button class="btn sm" id="bOut">ログアウト</button>':'')+'</div>'
      +'<div class="detail" id="diagBox" style="display:none">'+esc(diag||'（追加情報なし）')+'</div>';
    $('#bDiag').onclick=()=>{const d=$('#diagBox');d.style.display=d.style.display==='none'?'block':'none';};
    { const bo=$('#bOut'); if(bo) bo.onclick=()=>{ try{ localStorage.removeItem('waka_sb_session'); }catch(e){} location.reload(); }; }
    $('#bRe').onclick=async()=>{ await diagnose(); await loadAll(); toast('保存先を確認しました'); };
  }

  /* ============ 保存の実体 ============ */
  function isRateLimited(e){ return /rate limit/i.test(emsg(e)); }
  async function retry(fn,label){
    let last;
    for(let i=0;i<3;i++){
      try{ return await fn(); }
      catch(e){
        last=e;
        if(isRateLimited(e)) throw new Error('書き込みが立て込んだため、保存の受付が一時的に止められました。少し待つか、画面を開き直すと元に戻ります。（'+label+'）');
        await sleep(900*(i+1));
      }
    }
    throw new Error(label+'に失敗しました：'+emsg(last));
  }
  const S={
    get:k=>window.storage.get(k,shared),
    set:(k,v)=>window.storage.set(k,v,shared),
    del:k=>window.storage.delete(k,shared),
    list:p=>window.storage.list(p,shared)
  };
  async function readIx(k){
    try{ const r=await S.get(IXKEY(k)); const a=r?JSON.parse(r.value):[]; return Array.isArray(a)?a:[]; }catch(e){ return []; }
  }
  async function ixAdd(k,id){
    const cur=await readIx(k);
    if(cur.indexOf(id)<0){ cur.push(id); await retry(()=>S.set(IXKEY(k),JSON.stringify(cur)),'目次の更新'); }
  }
  async function ixDel(k,id){
    const cur=await readIx(k);
    try{ await S.set(IXKEY(k),JSON.stringify(cur.filter(x=>x!==id))); }catch(e){}
  }
  /* --- 本体は1つのまとまりで読み書きする（通信を最小限にする） --- */
  const BOOK=PFX+'book';
  let bookLoaded=false;
  async function saveBook(){
    if(mode==='memory') return;
    const payload=JSON.stringify({v:1,drafts:drafts,comments:comments,events:events});
    const w=await retry(()=>S.set(BOOK,payload),'保存');
    if(!w) throw new Error('保存が受け付けられませんでした');
  }
  async function loadBook(){
    if(mode==='memory'){ return {drafts:mem.d.slice(),comments:mem.c.slice(),events:mem.e.slice()}; }
    let b=null;
    try{ const r=await S.get(BOOK); if(r) b=JSON.parse(r.value); }catch(e){ b=null; }
    if(b && Array.isArray(b.drafts)) return {drafts:b.drafts,comments:b.comments||[],events:b.events||[]};
    const old=await fetchLegacy();
    if(old.drafts.length||old.comments.length||old.events.length){
      drafts=old.drafts; comments=old.comments; events=old.events;
      try{ await saveBook(); }catch(e){}
    }
    return old;
  }
  async function fetchLegacy(){
    const out={drafts:[],comments:[],events:[]};
    const keyOf={d:'drafts',c:'comments',e:'events'};
    for(const k of ['d','c','e']){
      let ids=[];
      try{
        if(mode==='list'){
          const l=await S.list(PFX+KIND[k]);
          const keys=(l&&Array.isArray(l.keys))?l.keys.map(x=>typeof x==='string'?x:(x&&x.key)||'').filter(Boolean):[];
          ids=keys.map(x=>x.slice((PFX+KIND[k]).length)).filter(Boolean);
        }else{ ids=await readIx(k); }
      }catch(e){ ids=[]; }
      for(let i=0;i<ids.length;i+=4){
        const part=await Promise.all(ids.slice(i,i+4).map(async id=>{
          try{ const r=await S.get(PFX+KIND[k]+id); if(!r) return null; const v=JSON.parse(r.value); v.id=v.id||id; return v; }
          catch(e){ return null; }
        }));
        part.forEach(v=>{ if(v) out[keyOf[k]].push(v); });
        await sleep(120);
      }
    }
    return out;
  }
  async function putKind(k,rec){
    const arr = k==='d'?drafts : (k==='c'?comments:events);
    const i=arr.findIndex(x=>x.id===rec.id);
    const backup=i>=0?arr[i]:null;
    if(i>=0) arr[i]=rec; else arr.push(rec);
    if(mode==='memory'){ mem.d=drafts.slice(); mem.c=comments.slice(); mem.e=events.slice(); return; }
    try{ await saveBook(); }
    catch(e){
      if(backup) arr[i]=backup; else { const j=arr.findIndex(x=>x.id===rec.id); if(j>=0) arr.splice(j,1); }
      throw e;
    }
  }
  async function delKind(k,id){
    let arr = k==='d'?drafts : (k==='c'?comments:events);
    const keep=arr.slice();
    const next=arr.filter(x=>x.id!==id);
    if(k==='d') drafts=next; else if(k==='c') comments=next; else events=next;
    if(mode==='memory'){ mem.d=drafts.slice(); mem.c=comments.slice(); mem.e=events.slice(); return; }
    try{ await saveBook(); }
    catch(e){
      if(k==='d') drafts=keep; else if(k==='c') comments=keep; else events=keep;
      throw e;
    }
  }

  /* ============ 本文の30字折り返し ============ */
  function normText(t){
    return String(t||'').replace(/\r\n?/g,'\n')
      .replace(/[ \t\u3000]+$/gm,'')
      .replace(/\n{2,}/g,'\n')
      .replace(/^\n+|\n+$/g,'');
  }
  function wrapLines(text){
    const out=[];
    normText(text).split(/\n/).forEach(p=>{
      if(p===''){ out.push(''); return; }
      for(let i=0;i<p.length;i+=30) out.push(p.slice(i,i+30));
    });
    return out.length?out:[''];
  }
  function segHTML(l,start,ranges,re,sel){
    const n=l.length;
    if(!n) return '';
    const cid=new Array(n).fill('');
    (ranges||[]).forEach(r=>{
      const a=Math.max(r.s-start,0), b=Math.min(r.e-start,n);
      for(let k=a;k<b;k++) cid[k]=r.id;
    });
    const hit=new Array(n).fill(false);
    if(re){ re.lastIndex=0; let m;
      while((m=re.exec(l))!==null){
        for(let k=m.index;k<m.index+m[0].length;k++) hit[k]=true;
        if(m.index===re.lastIndex) re.lastIndex++;
      } }
    const sl=new Array(n).fill(false);
    if(sel){ const a=Math.max(sel.s-start,0), b=Math.min(sel.e-start,n); for(let k=a;k<b;k++) sl[k]=true; }
    let out='',k=0;
    while(k<n){
      let j=k;
      while(j<n && cid[j]===cid[k] && hit[j]===hit[k] && sl[j]===sl[k]) j++;
      const t=esc(l.slice(k,j));
      const cls=[cid[k]?'cm':'',hit[k]?'hit':'',sl[k]?'sel':''].filter(Boolean).join(' ');
      out += cls ? '<span class="'+cls+'"'+(cid[k]?' data-cid="'+esc(cid[k])+'"':'')+'>'+t+'</span>' : t;
      k=j;
    }
    return out;
  }
  function sheetHTML(text,q,ranges,sel){
    const ls=wrapLines(text);
    let re=null;
    if(q){ try{ re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'); }catch(e){} }
    let html='', abs=0;
    ls.forEach(function(l,i){
      const n=i+1;
      if(n>1 && (n-1)%PER_PAGE===0) html+='<div class="pgmark">'+((n-1)/PER_PAGE+1)+'頁目</div>';
      html+='<li data-i="'+i+'" data-a="'+abs+'"><span class="ln">'+(((n-1)%PER_PAGE)+1)+'</span>'
           +'<span class="tx">'+segHTML(l,abs,ranges,re,sel)+'</span></li>';
      abs+=l.length;
    });
    return '<ul class="sheet">'+html+'</ul>';
  }

  /* ============ Wordのコメント読み取り ============ */
  function attrId(el){ for(let i=0;i<el.attributes.length;i++){ const a=el.attributes[i]; if(a.localName==='id') return a.value; } return null; }
  function paraText(el){
    const out=[];
    const all=el.getElementsByTagName('*');
    for(let i=0;i<all.length;i++){
      if(all[i].localName!=='p') continue;
      let t='', rs=all[i].getElementsByTagName('*');
      for(let j=0;j<rs.length;j++){ if(rs[j].localName==='t') t+=rs[j].textContent; }
      if(t.trim()) out.push(t);
    }
    return out.join('\n');
  }
  async function readDocx(file){
    if(!window.JSZip) throw new Error('Wordを読む部品を読み込めませんでした');
    const zip=await window.JSZip.loadAsync(await file.arrayBuffer());
    const df=zip.file('word/document.xml');
    if(!df) throw new Error('Wordの中身を取り出せませんでした');
    const doc=new DOMParser().parseFromString(await df.async('string'),'application/xml');
    let text='', rg={};
    (function walk(n){
      for(let c=n.firstChild;c;c=c.nextSibling){
        if(c.nodeType!==1) continue;
        const ln=c.localName;
        if(ln==='t') text+=c.textContent;
        else if(ln==='tab') text+='　';
        else if(ln==='br') text+='\n';
        else if(ln==='commentRangeStart'){ const id=attrId(c); if(id!=null){ rg[id]=rg[id]||{}; rg[id].s=text.length; } }
        else if(ln==='commentRangeEnd'){ const id=attrId(c); if(id!=null){ rg[id]=rg[id]||{}; rg[id].e=text.length; } }
        else if(ln==='commentReference'){ const id=attrId(c); if(id!=null&&rg[id]&&rg[id].e==null) rg[id].e=text.length; }
        else { walk(c); if(ln==='p') text+='\n'; }
      }
    })(doc.documentElement);
    const list=[];
    const cf=zip.file('word/comments.xml');
    if(cf){
      const cx=new DOMParser().parseFromString(await cf.async('string'),'application/xml');
      const all=cx.getElementsByTagName('*');
      for(let i=0;i<all.length;i++){
        const e=all[i]; if(e.localName!=='comment') continue;
        const id=attrId(e), body=paraText(e).trim();
        if(!body) continue;
        let au=''; for(let k=0;k<e.attributes.length;k++){ if(e.attributes[k].localName==='author') au=e.attributes[k].value; }
        const r=rg[id]||{};
        const q=(r.s!=null&&r.e!=null&&r.e>r.s)?text.slice(r.s,r.e):'';
        list.push({id:id,body:body,author:au,quote:q});
      }
    }
    return {text:text,comments:list};
  }
  function findAnchor(body,quote){
    const q=String(quote||'').replace(/\s/g,'');
    if(q.length<2) return null;
    const map=[]; let sq='';
    for(let i=0;i<body.length;i++){ if(!/\s/.test(body[i])){ map.push(i); sq+=body[i]; } }
    let k=sq.indexOf(q);
    if(k<0&&q.length>24) k=sq.indexOf(q.slice(0,24));
    if(k<0) return null;
    const len=Math.min(q.length,sq.length-k);
    return {s:map[k],e:map[k+len-1]+1};
  }

  /* ============ ファイル読み取り ============ */
  function toB64(file){
    return new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=()=>res(String(r.result).split(',')[1]||'');
      r.onerror=()=>rej(new Error('ファイルを読めませんでした'));
      r.readAsDataURL(file);
    });
  }
  function b64ToU8(b64){
    const bin=atob(b64), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return u;
  }
  async function pdfToText(u8){
    if(!window.pdfjsLib) throw new Error('PDFを読む部品を読み込めませんでした');
    const doc=await window.pdfjsLib.getDocument({data:u8}).promise;
    const pages=[];
    for(let p=1;p<=doc.numPages;p++){
      const pg=await doc.getPage(p), tc=await pg.getTextContent();
      const lines=[]; let buf='', curY=null;
      tc.items.forEach(function(it){
        const y=Math.round(it.transform[5]);
        if(curY===null){ curY=y; }
        else if(Math.abs(y-curY)>2){ lines.push(buf); buf=''; curY=y; }
        buf+=it.str;
        if(it.hasEOL){ lines.push(buf); buf=''; curY=null; }
      });
      if(buf) lines.push(buf);
      pages.push(lines.join('\n'));
    }
    return pages.join('\n').trim();
  }
  function setLoadText(t){ const e=document.querySelector('#loadTxt'); if(e) e.textContent=t; }
  function loadImg(b64){
    return new Promise(function(res,rej){
      const im=new Image();
      im.onload=function(){res(im);}; im.onerror=function(){rej(new Error('画像を読めませんでした'));};
      im.src='data:image/jpeg;base64,'+b64;
    });
  }
  async function pdfToImages(u8,onp){
    if(!window.pdfjsLib) throw new Error('PDFを読む部品を読み込めませんでした');
    const doc=await window.pdfjsLib.getDocument({data:u8}).promise;
    const out=[];
    for(let p=1;p<=doc.numPages;p++){
      if(onp) onp(p,doc.numPages);
      const pg=await doc.getPage(p);
      const v1=pg.getViewport({scale:1});
      const vp=pg.getViewport({scale:Math.min(1600/v1.width,3)});
      const cv=document.createElement('canvas');
      cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
      const cx=cv.getContext('2d');
      cx.fillStyle='#FFFFFF'; cx.fillRect(0,0,cv.width,cv.height);
      await pg.render({canvasContext:cx,viewport:vp}).promise;
      let q=0.72, b64=cv.toDataURL('image/jpeg',q).split(',')[1];
      while(b64.length>MAXFILE*0.9 && q>0.34){ q-=0.12; b64=cv.toDataURL('image/jpeg',q).split(',')[1]; }
      out.push({data:b64});
      await sleep(0);
    }
    return out;
  }
  function loadImgAny(src){
    return new Promise(function(res,rej){
      const im=new Image();
      im.onload=function(){res(im);}; im.onerror=function(){rej(new Error('画像を読めませんでした'));};
      im.src=src;
    });
  }
  function withTimeout(p,ms,label){
    return Promise.race([p,new Promise(function(_,rej){
      setTimeout(function(){ rej(new Error(label+'に時間がかかりすぎました。写真を小さくするか、PDFにして試してください。')); },ms);
    })]);
  }
  async function decodeImage(file){
    if(window.createImageBitmap){
      try{ return await withTimeout(createImageBitmap(file),20000,'写真の読み取り'); }catch(e){}
    }
    const url=URL.createObjectURL(file);
    try{ return await withTimeout(loadImgAny(url),20000,'写真の読み取り'); }
    finally{ setTimeout(function(){ try{URL.revokeObjectURL(url);}catch(e){} },2000); }
  }
  async function shrinkImage(file){
    const im=await decodeImage(file);
    const sc=Math.min(1,1600/Math.max(im.width,im.height));
    const cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(im.width*sc)); cv.height=Math.max(1,Math.round(im.height*sc));
    const cx=cv.getContext('2d');
    cx.fillStyle='#FFFFFF'; cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(im,0,0,cv.width,cv.height);
    if(im.close) try{ im.close(); }catch(e){}
    await sleep(0);
    let q=0.72, b64=cv.toDataURL('image/jpeg',q).split(',')[1];
    while(b64.length>MAXFILE*0.9 && q>0.34){ q-=0.12; b64=cv.toDataURL('image/jpeg',q).split(',')[1]; }
    cv.width=1; cv.height=1;
    return b64;
  }
  async function cropPart(b64,from,to){
    const im=await loadImg(b64);
    const y=Math.round(im.height*from), h=Math.round(im.height*(to-from));
    const cv=document.createElement('canvas'); cv.width=im.width; cv.height=h;
    cv.getContext('2d').drawImage(im,0,y,im.width,h,0,0,im.width,h);
    return cv.toDataURL('image/jpeg',0.75).split(',')[1];
  }
  async function askClaude(b64,note){
    const prompt='これは日本語の手書き答案をスキャンした画像です'+(note?'（'+note+'）':'')+'。'
      +'書かれている文字を、そのまま書き写してください。\n'
      +'・要約・説明・前置き・感想は一切書かず、答案の文字だけを出力する\n'
      +'・改行は原文のとおりにする\n'
      +'・誤字や言い回しも直さず、書かれたとおりに写す\n'
      +'・どうしても読めない文字は ［？］ と書く\n'
      +'・推測で言葉を補わない';
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
          {type:'text',text:prompt}]}]})
    });
    if(!res.ok) throw new Error('文字起こしができませんでした（'+res.status+'）');
    const data=await res.json();
    const t=(data.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('').trim();
    return {text:t,cut:data.stop_reason==='max_tokens'};
  }
  async function transcribePage(b64,i,n){
    setLoadText(i+'/'+n+' ページ目を読んでいます…');
    const r=await askClaude(b64,'');
    if(!r.cut) return r.text;
    setLoadText(i+'/'+n+' ページ目（上半分）を読んでいます…');
    const a=await askClaude(await cropPart(b64,0,0.56),'ページの上半分');

  async function transcribeAll(pages){
    const out=[];
    for(let i=0;i<pages.length;i++) out.push(await transcribePage(pages[i].data,i+1,pages.length));
    return out.join('\n');

  async function renderPdf(u8,box,maxPages){
    const doc=await window.pdfjsLib.getDocument({data:u8}).promise;
    const n=Math.min(doc.numPages,maxPages||8);
    box.innerHTML='';
    for(let p=1;p<=n;p++){
      const pg=await doc.getPage(p);
      const w=Math.min(box.clientWidth||700,900);
      const v0=pg.getViewport({scale:1});
      const vp=pg.getViewport({scale:w/v0.width});
      const cv=document.createElement('canvas');
      cv.width=vp.width; cv.height=vp.height;
      box.appendChild(cv);
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    }
    if(doc.numPages>n){
      const p=document.createElement('p'); p.className='hint';
      p.textContent='（全'+doc.numPages+'頁のうち'+n+'頁まで表示しています）';
      box.appendChild(p);
    }
  }

    function closestLi(node){
      let n=node;
      while(n && n!==sheetcol){ if(n.nodeType===1 && n.tagName==='LI') return n; n=n.parentNode; }
      return null;
    }
    function absOf(node,offset){
      const li=closestLi(node); if(!li) return null;
      const tx=li.querySelector('.tx'); if(!tx) return null;
      if(node===li || node===tx) return Number(li.dataset.a);
      let acc=0, done=false;
      (function walk(nd){
        if(done) return;
        if(nd.nodeType===3){ if(nd===node){ acc+=offset; done=true; } else acc+=nd.nodeValue.length; return; }
        for(let c=nd.firstChild;c;c=c.nextSibling){ walk(c); if(done) return; }
      })(tx);
      return Number(li.dataset.a)+acc;
    }

    function readSelection(){
      const w=window.getSelection();
      if(!w || w.rangeCount===0) return;
      const r=w.getRangeAt(0);
      if(!sheetcol.contains(r.commonAncestorContainer)) return;
      if(w.isCollapsed){
        const li=closestLi(r.startContainer); if(!li) return;
        const i=Number(li.dataset.i);
        const a=prefix[i], b=a+ls[i].length;
        if(sel && sel.s===a && sel.e===b) setSel(0,0); else setSel(a,b);
        return;
      }
      const a=absOf(r.startContainer,r.startOffset), b=absOf(r.endContainer,r.endOffset);
      if(a===null||b===null) return;
      setSel(Math.min(a,b),Math.max(a,b));
      w.removeAllRanges();

      const cards=Array.prototype.slice.call(host.querySelectorAll('.memoCard'));
      if(window.innerWidth<1100){
        cards.forEach(c=>c.style.top=''); host.style.height=''; svg.innerHTML=''; return;
      }
      const pr=pane.getBoundingClientRect();
      const cols=Array.prototype.slice.call(pane.querySelectorAll('.pagecol')).map(c=>c.getBoundingClientRect());
      let next=0; const spots=[];
      cards.forEach(function(card,idx){
        const cid=card.dataset.cid;
        const t=pane.querySelector('.cm[data-cid="'+cid+'"]');
        let want=0, y=null, pg=0;
        if(t){
          const r=t.getBoundingClientRect();
          y=r.top-pr.top+r.height/2; want=r.top-pr.top-6;
          for(let i=0;i<cols.length;i++){ if(r.left>=cols[i].left-2 && r.left<=cols[i].right+2){ pg=i; break; } }
        }
        const top=Math.max(want,next);
        card.style.top=top+'px';
        next=top+card.offsetHeight+10;
        spots.push({y:y,top:top,pg:pg,i:idx,cid:cid});
      });
      host.style.height=(next+10)+'px';
      const mR=host.getBoundingClientRect();
      const xEnd=mR.left-pr.left;
      let g='';
      spots.forEach(function(sp){
        if(sp.y===null||!cols.length) return;
        const c=colorMap[sp.cid]||'#C86E7C', y2=sp.top+14;
        const r=cols[sp.pg];
        const lane=r.right-pr.left+4+(sp.i%4)*3;
        if(sp.pg%2===1 || sp.pg===cols.length-1){
          const mid=lane+(xEnd-lane)/2;
          g+='<path d="M'+lane+','+sp.y+' L'+mid+','+sp.y+' L'+mid+','+y2+' L'+xEnd+','+y2+'" fill="none" stroke="'+c+'" stroke-width="1.3" opacity=".75"/>';
        }else{
          const up=(sp.y-(r.top-pr.top))<(r.height/2);
          const rail=up ? (r.top-pr.top+4+(sp.i%4)*3) : (r.bottom-pr.top-4-(sp.i%4)*3);
          g+='<path d="M'+lane+','+sp.y+' L'+lane+','+rail+' L'+(xEnd-12)+','+rail+' L'+(xEnd-12)+','+y2+' L'+xEnd+','+y2+'" fill="none" stroke="'+c+'" stroke-width="1.3" opacity=".75"/>';
        }
        g+='<circle cx="'+lane+'" cy="'+sp.y+'" r="2.6" fill="'+c+'"/>';
      });
      svg.setAttribute('width',pr.width); svg.setAttribute('height',pane.scrollHeight);
      svg.innerHTML=g;
    }
    window.addEventListener('resize',layout);

    drawSheet(); paintMemos();

    dw.querySelector('#rq').oninput=function(e){ curQ=e.target.value; drawSheet(); layout(); };
    dw.querySelector('#bCp').onclick=async function(){try{await navigator.clipboard.writeText(normText(d.body));toast('コピーしました');}catch(e){toast('コピーできませんでした');}};
    dw.querySelector('#bDel').onclick=async function(e){

        await delFile(id,'prb'); await delFile(id,'shu');
        for(let i=1;i<=(d.pageCount||0);i++){ try{ await delFile(id,'p'+i); }catch(err){} }

    };
    dw.querySelector('#cSend').onclick=async function(e){

      }finally{ btn.disabled=false; btn.textContent='全体にメモを付ける'; }
    };
  }

    async function readFile(f){
      dw.querySelector('#fname').textContent=f.name; dw.dataset.filename=f.name;
      const nm=f.name.toLowerCase();
      if(nm.endsWith('.docx')){
        setLoading(true,'Wordを読んでいます…');
        docxCms=[];
        try{
          const r=await readDocx(f);
          bodyEl.value=normText(r.text); cnt();
          docxCms=r.comments||[];
          const fb=wrapLines(normText(r.text)).join(''); let n=0; docxCms.forEach(c=>{ if(findAnchor(fb,c.quote)) n++; });
          upmsg('<div class="ok">'+esc(f.name)+' を読み込みました。'
            +(docxCms.length
              ? '<br><b>コメントが '+docxCms.length+' 件</b>見つかりました（本文に結びつくもの '+n+' 件）。'

              : '<br>コメントは入っていませんでした。')

          try{
            if(!window.mammoth) throw e;
            const res=await window.mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});
            bodyEl.value=(res.value||'').trim(); cnt();
            upmsg('<div class="ok">'+esc(f.name)+' の本文を読み込みました。コメントは取り出せませんでした。</div>');

        }finally{ setLoading(false); }

        upmsg('<div class="ok">PDFを読んでいます…</div>');
        setLoading(true,'PDFを読んでいます…');
        try{
          const buf=await f.arrayBuffer();
          const txt=await pdfToText(new Uint8Array(buf.slice(0)));

            scanPages=null; renderScan();
            bodyEl.value=txt; cnt();
            upmsg('<div class="ok">'+esc(f.name)+' から文字を取り出しました。文字数を確かめてください。</div>');

            setLoadText('ページを画像にしています…');

            renderScan();
            upmsg('<div class="ok">手書き（画像）の答案として取り込みました。'+scanPages.length+'ページ分の原本を残します。'
              +'<br>下の「Claudeに文字起こしさせる」を押すと、本文の下書きを作れます。押さずにそのまま置くこともできます。</div>');

      }else{
        try{ bodyEl.value=(await f.text()).trim(); cnt(); upmsg('<div class="ok">'+esc(f.name)+' を読み込みました。</div>'); }
        catch(e){ upmsg('<div class="err">ファイルを読めませんでした。本文を貼り付けてください。</div>'); }

      const rec={id:uid(),author:AUTHOR,year:g('u_year').value,exam:g('u_exam').value,subject:g('u_subject').value,
        writtenDate:g('u_written').value||'',memo:g('u_memo').value.trim(),filename:dw.dataset.filename||'',

        transcript:didOCR?'claude':'',checked:false};

      setLoading(true,'保存しています…');

          const a=findAnchor(flat,c.quote);

          if(a){ m.s=a.s; m.e=a.e; m.quote=flat.slice(a.s,a.e).slice(0,60); }
          comments.push(m); cmN++;
        });
      }
      try{
        await putKind('d',rec);
        if(prbFile) try{ await putFile(rec.id,'prb',prbFile); }catch(err){ toast('問題のファイルだけ保存できませんでした'); rec.hasProblem=false; await putKind('d',rec); }
        if(shuFile) try{ await putFile(rec.id,'shu',shuFile); }catch(err){ toast('出題趣旨のファイルだけ保存できませんでした'); rec.hasShushi=false; await putKind('d',rec); }
        if(scanPages&&scanPages.length){
          let ng=0;
          for(let i=0;i<scanPages.length;i++){
            setLoadText('原本を保存しています…（'+(i+1)+'/'+scanPages.length+'）');
            try{ await putFile(rec.id,'p'+(i+1),{name:'p'+(i+1)+'.jpg',type:'image/jpeg',data:scanPages[i].data}); }
            catch(err){ ng++; }
          }
          if(ng){ toast(ng+'ページ分の原本は保存できませんでした'); }
        }
        closeDrawer(); await loadAll();
        toast(cmN?('保存しました（コメント '+cmN+' 件）'):(mode==='memory'?'この画面にだけ置きました':'保存しました'));
      }catch(err){
        comments=cmKeep;
        btn.disabled=false; btn.textContent='保存する';
        upmsg('<div class="err">'+esc(emsg(err))+'<br>入力は消えていません。もう一度「保存する」を押してください。直らないときは「書き出し」で控えを取ってください。</div>');
      }finally{ setLoading(false); }
    };
  }

    const lvOf=d=>d.stage==='kousei'?1:2;
    let lv=0, rev=false; list.forEach(d=>{ lv=Math.max(lv,lvOf(d)); if(reviewed[d.id]) rev=true; });
    const top=list.filter(d=>lvOf(d)===lv).sort((a,b)=>(b.writtenDate||fmtDay(b.uploadedAt)).localeCompare(a.writtenDate||fmtDay(a.uploadedAt)))[0]||null;
    return {list:list,lv:lv,rev:rev,top:top};

  /* ============ 書き出し・読み込み ============ */
  async function payload(withFiles){
    const files={};
    if(withFiles){
      for(const d of drafts){
        if(d.hasProblem){ const f=await getFile(d.id,'prb'); if(f) files[d.id+'_prb']=f; }
        if(d.hasShushi){ const f=await getFile(d.id,'shu'); if(f) files[d.id+'_shu']=f; }
        for(let i=1;i<=(d.pageCount||0);i++){ const f=await getFile(d.id,'p'+i); if(f) files[d.id+'_p'+i]=f; }
      }
    }
    return JSON.stringify({app:'わかちゃんのおへや',version:1,exportedAt:new Date().toISOString(),
      drafts:drafts,comments:comments,events:events,files:files},null,1);
  }

  function openImport(){

  async function importObj(obj,onProg){
    let stopped=false;
    const paced=async function(fn){
      if(stopped) throw new Error('stopped');
      try{ const r=await fn(); await sleep(260); return r; }
      catch(e){ if(isRateLimited(e)) stopped=true; throw e; }
    };
    const res=await importCore(obj,paced,onProg,function(){return stopped;});
    res.stopped=stopped;
    return res;
  }
  async function importCore(obj,paced,onProg,isStopped){
    const D=Array.isArray(obj)?obj:(obj.drafts||obj.items||[]);
    const C=obj.comments||[], E=obj.events||[], F=obj.files||{};
    let n=0,f=0,cc=0,ee=0; const map={};
    const total=D.length+ (obj.comments||[]).length + (obj.events||[]).length;
    let done=0;
    const tick=function(){ done++; if(onProg) onProg(done,total); };
    for(const r of D){
      if(isStopped&&isStopped()) break;
      if(!r||(!r.body&&!r.pageCount)) continue;
      const oid=r.id||uid(), nid=uid(); map[oid]=nid;
      const rec={id:nid,author:AUTHOR,year:r.year||'',exam:r.exam||'',subject:r.subject||'',
        writtenDate:r.writtenDate||'',memo:r.memo||'',filename:r.filename||'',body:normText(r.body||''),
        uploadedAt:r.uploadedAt||new Date().toISOString(),
        hasProblem:false,problemName:'',hasShushi:false,shushiName:'',
        scan:false,pageCount:0,transcript:r.transcript||'',checked:!!r.checked};
      try{
        const pf=F[oid+'_prb'], sf=F[oid+'_shu'];
        if(pf){ try{ await paced(()=>putFile(nid,'prb',pf)); rec.hasProblem=true; rec.problemName=pf.name||''; }catch(e){ f++; } }
        if(sf){ try{ await paced(()=>putFile(nid,'shu',sf)); rec.hasShushi=true; rec.shushiName=sf.name||''; }catch(e){ f++; } }
        for(let i=1;i<=(r.pageCount||0);i++){
          const g=F[oid+'_p'+i];
          if(g){ try{ await paced(()=>putFile(nid,'p'+i,g)); rec.scan=true; rec.pageCount=i; }catch(e){ f++; } }
        }
        drafts.push(rec); n++; tick();
      }catch(e){ f++; if(isStopped&&isStopped()) break; }
    }
    for(const c of C){ if(isStopped&&isStopped()) break; if(!c||!c.body) continue;
      try{ comments.push({id:uid(),draftId:map[c.draftId]||c.draftId,body:c.body,
        s:c.s,e:c.e,quote:c.quote||'',line:c.line,at:c.at||new Date().toISOString()}); cc++; tick(); }catch(e){ f++; } }
    for(const ev of E){ if(isStopped&&isStopped()) break; if(!ev||!ev.date) continue;
      try{ events.push({id:uid(),date:ev.date,time:ev.time||'',subject:ev.subject||'',memo:ev.memo||'',at:ev.at||new Date().toISOString()}); ee++; tick(); }catch(e){ f++; } }
    sortAll();
    try{ await saveBook(); }catch(e){ f++; throw e; }
    return {n:n,c:cc,e:ee,f:f};
  }

  /* ===== クラウド保存（Supabase）：MacでもiPhoneでも同じ答案が出る ===== */
  async function ensureCloud(){
    if(window.storage) return false;
    const SB_URL='https://pleuzhcpdwkdjuzrvomb.supabase.co', SB_KEY='sb_publishable_6qNh5XxWXFFxShwL2PotVw_MVRBzX7t';
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$|^http:\/\/localhost/.test(SB_URL)) return false;
    const BASE=SB_URL.replace(/\/$/,''), SK='waka_sb_session';
    let sess=null;
    try{ sess=JSON.parse(localStorage.getItem(SK)||'null'); }catch(e){ sess=null; }
    const keep=j=>{
      sess={access_token:j.access_token,refresh_token:j.refresh_token,
            expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),
            user_id:(j.user&&j.user.id)||(sess&&sess.user_id)};
      try{ localStorage.setItem(SK,JSON.stringify(sess)); }catch(e){}
    };
    const drop=()=>{ sess=null; try{ localStorage.removeItem(SK); }catch(e){} };
    async function raw(path,method,body,bearer,extra){
      const h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},bearer?{Authorization:'Bearer '+bearer}:{},extra||{});
      return fetch(BASE+path,{method:method,headers:h,body:body==null?undefined:JSON.stringify(body)});
    }
    async function refresh(){
      const r=await raw('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:sess.refresh_token});
      if(!r.ok){ drop(); throw new Error('ログインの期限が切れました。ページを開き直して，もう一度ログインしてください。'); }
      keep(await r.json());
    }
    async function token(){
      if(!sess) throw new Error('ログインしていません。ページを開き直してください。');
      if(sess.expires_at*1000-Date.now()<60000) await refresh();
      return sess.access_token;
    }
    async function rest(path,method,body,extra){
      let r=await raw('/rest/v1/'+path,method,body,await token(),extra);
      if(r.status===401){ await refresh(); r=await raw('/rest/v1/'+path,method,body,sess.access_token,extra); }
      if(!r.ok){
        let t=''; try{ t=(await r.text()).slice(0,160); }catch(e){}
        throw new Error('クラウドとの通信に失敗しました（'+r.status+'）'+(t?' '+t:''));
      }
      return r;
    }
    /* ログイン画面 */
    function loginUI(){
      return new Promise(function(done){

        ov.style.cssText='position:fixed;inset:0;z-index:200;background:#FAFBF3;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto';
        ov.innerHTML='<div style="width:min(380px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 8px 30px rgba(78,139,95,.14)">'
          +'<div style="text-align:center;font-size:44px;line-height:1">\u{1F43C}</div>'
          +'<h2 style="font-family:var(--mincho);text-align:center;margin:8px 0 4px;font-size:21px;letter-spacing:.06em">わかちゃんのおへや</h2>'
          +'<p style="text-align:center;font-size:12px;color:var(--muted);margin:0 0 16px">ログインすると，どの端末でも同じ答案が出ます</p>'
          +'<form id="lgF"><div class="fld"><label>メールアドレス</label><input class="fin2" id="lgE" type="email" autocomplete="username" required></div>'
          +'<div class="fld"><label>パスワード（8文字以上）</label><input class="fin2" id="lgP" type="password" autocomplete="current-password" minlength="8" required></div>'
          +'<div id="lgM" style="min-height:20px;font-size:12.5px;color:#8A4049;margin-bottom:8px"></div>'
          +'<div class="row" style="flex-direction:column;align-items:stretch;gap:8px">'
          +'<button class="btn pri" id="lgIn" type="submit">ログイン</button>'
          +'<button class="btn" id="lgUp" type="button">はじめて使う（新しく登録）</button></div></form></div>';
        document.body.appendChild(ov);
        const E=ov.querySelector('#lgE'), P=ov.querySelector('#lgP'), M=ov.querySelector('#lgM');
        const say=t=>{ M.textContent=t||''; };
        const busyBtn=on=>ov.querySelectorAll('button').forEach(b=>b.disabled=on);
        async function go(signup){
          if(!E.value||P.value.length<8){ say('メールアドレスと，8文字以上のパスワードを入れてください。'); return; }
          say(''); busyBtn(true);
          try{
            const r=await raw(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password','POST',{email:E.value.trim(),password:P.value});
            const j=await r.json().catch(()=>({}));
            if(!r.ok){
              const m=String(j.msg||j.error_description||j.message||'');
              if(/already|registered/i.test(m)) say('このメールアドレスはもう登録されています。「ログイン」を押してください。');

  async function ensureStorage(){
    if(window.storage) return;
    /* ふつうのウェブサイトとして開いたとき：このブラウザの中（IndexedDB）に保存する */
    const open=()=>new Promise((res,rej)=>{
      const r=indexedDB.open('wakachan-oheya',1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
    let db;
    try{ db=await open(); }catch(e){ return; }
    const tx=(mode,fn)=>new Promise((res,rej)=>{
      const t=db.transaction('kv',mode), st=t.objectStore('kv'), q=fn(st);
      t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
    });
    window.__idb=true;
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    window.storage={
      get:async k=>{ const v=await tx('readonly',s=>s.get(String(k))); return v==null?null:{key:k,value:v}; },
      set:async (k,v)=>{ await tx('readwrite',s=>s.put(String(v),String(k))); return true; },
      delete:async k=>{ await tx('readwrite',s=>s.delete(String(k))); return true; },
      list:async p=>{ const ks=await tx('readonly',s=>s.getAllKeys()); return {keys:(ks||[]).filter(x=>String(x).indexOf(p)===0)}; }
    };
  }

  (async function init(){

    try{ if(!(await ensureCloud())) await ensureStorage(); await diagnose(); paintStatus(); }finally{ setLoading(false); }
